name: Murmur
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  MurmurKit:
    path: Packages/MurmurKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.3

targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: MurmurKit
        product: MurmurCore
      - package: MurmurKit
        product: MurmurBrand
      - package: MurmurKit
        product: MurmurUI
      - package: Supabase
        product: Supabase
      - target: MurmurKeyboard
      - target: MurmurWidgets
    settings:
      base:
        PRODUCT_NAME: Murmur
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_PREFIX).murmur
        CODE_SIGN_STYLE: $(MURMUR_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(MURMUR_SIGN_IDENTITY)
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(MURMUR_PROFILE_APP)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(MURMUR_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Light only, by choice. The colours (MurmurBrand) have dark values, which the keyboard
        # uses: it follows the host app's appearance and is not affected by this.
        UIUserInterfaceStyle: Light
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Murmur listens only while you dictate, to turn your speech into text.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(MURMUR_URL_SCHEME)
        LSApplicationQueriesSchemes:
          - mobilenotes
          - sms
          - message
          - whatsapp
          - tg
          - fb-messenger
          - slack
          - msteams
          - discord
          - notion
          - obsidian
          - bear
          - evernote
          - googlegmail
          - ms-outlook
          - linkedin
          - chatgpt
          - claude
          - perplexity-app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MurmurAppGroupID: $(MURMUR_APP_GROUP)
        MurmurURLScheme: $(MURMUR_URL_SCHEME)
        MurmurSupabaseHost: $(SUPABASE_HOST)
        MurmurSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        MurmurTermsURL: $(MURMUR_TERMS_URL)
        MurmurPrivacyURL: $(MURMUR_PRIVACY_URL)
        MurmurSupportURL: $(MURMUR_SUPPORT_URL)
        MurmurInviteURL: $(MURMUR_INVITE_URL)
    entitlements:
      path: App/Murmur.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MURMUR_APP_GROUP)
        # Sign in with Apple (the app's ID has the capability; scripts/provision_dev.mjs).
        com.apple.developer.applesignin:
          - Default

  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    dependencies:
      - package: MurmurKit
        product: MurmurCore
      - package: MurmurKit
        product: MurmurBrand
    settings:
      base:
        PRODUCT_NAME: MurmurKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_PREFIX).murmur.keyboard
        CODE_SIGN_STYLE: $(MURMUR_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(MURMUR_SIGN_IDENTITY)
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(MURMUR_PROFILE_KEYBOARD)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: $(MURMUR_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            # "mul": a keyboard for several languages (Russian and English dictation).
            PrimaryLanguage: mul
            RequestsOpenAccess: true
        MurmurAppGroupID: $(MURMUR_APP_GROUP)
        MurmurURLScheme: $(MURMUR_URL_SCHEME)
    entitlements:
      path: Keyboard/MurmurKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MURMUR_APP_GROUP)

  MurmurWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: MurmurKit
        product: MurmurBrand
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: MurmurWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_PREFIX).murmur.widgets
        CODE_SIGN_STYLE: $(MURMUR_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(MURMUR_SIGN_IDENTITY)
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(MURMUR_PROFILE_WIDGETS)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(MURMUR_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        MurmurAppGroupID: $(MURMUR_APP_GROUP)
        MurmurURLScheme: $(MURMUR_URL_SCHEME)
    entitlements:
      path: Widgets/MurmurWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MURMUR_APP_GROUP)

  MurmurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MurmurTests
    dependencies:
      - target: Murmur
      - package: MurmurKit
        product: MurmurCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_PREFIX).murmur.tests
        GENERATE_INFOPLIST_FILE: YES

  MurmurUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MurmurUITests
      # The identifiers the tests find elements by, and onboarding's words, shared with the app.
      - path: App/Sources/App/AccessibilityID.swift
      - path: App/Sources/Onboarding/OnboardingCopy.swift
    dependencies:
      - target: Murmur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_PREFIX).murmur.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Murmur

schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurTests: [test]
    run:
      config: Debug
      # Murmur Pro's two subscriptions for purchases in the simulator, without App Store Connect.
      storeKitConfiguration: Config/Murmur.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MurmurTests
        - package: MurmurKit/MurmurCoreTests
        - package: MurmurKit/MurmurBrandTests
    archive:
      config: Release
  # The onboarding journey on fake services (minutes, so it is kept out of the Murmur scheme).
  OnboardingJourney:
    build:
      targets:
        Murmur: all
        MurmurUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MurmurUITests
  MurmurKeyboard:
    build:
      targets:
        MurmurKeyboard: all
        Murmur: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
