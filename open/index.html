<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Open Murmur</title>
<meta name="description" content="Opens Murmur on your iPhone.">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="site"><a class="brand" href="../" aria-label="Murmur"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>murmur</span></a></header>
<main>
<h1>Opening Murmur…</h1>
<p>If Murmur doesn’t open by itself, tap the button. Open this page on the iPhone where you use Murmur.</p>
<a id="open-app" class="button" href="murmur://">Open Murmur</a>
<a class="button secondary" href="https://apps.apple.com/app/id6829429992">Get Murmur on the App Store</a>

<script>
  // The lifecycle emails link here (…/open/?to=pro): an https link that mail apps don't block,
  // handing over to Murmur's own link. Only screens the app's links know are offered.
  (() => {
    const routes = { pro: "murmur://pro", settings: "murmur://settings" };
    const target = routes[new URLSearchParams(location.search).get("to")] || "murmur://";
    document.getElementById("open-app").href = target;
    // Only an iPhone or iPad can open it; elsewhere the page just explains.
    if (/iPhone|iPad|iPod/.test(navigator.platform) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform))) {
      location.href = target;
    }
  })();
</script>
</main>
